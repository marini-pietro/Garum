[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "garum"
version = "0.1.0"
description = "A cross-platform nutrition tracker built with Flet."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "flet>=0.24.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["garum*"]
